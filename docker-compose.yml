services:
  db:
    image: postgres:16
    container_name: mygift_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PW}
      POSTGRES_DB: ${PG_DB}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PG_USER} -d ${PG_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '15432:5432'
    volumes:
      - mygift_pgdata:/var/lib/postgresql/data

volumes:
  mygift_pgdata:
